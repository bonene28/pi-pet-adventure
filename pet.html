<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetVerse - Choose Your Pet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="menu">

<h1>Choose Your Starter Pet</h1>
<p>Select one pet to begin your adventure.</p>

<div class="pet-card">
<h2>🔥 Blaze Fox</h2>
<p>Element: Fire</p>
<p>HP: 120 | ATK: 30 | DEF: 15 | SPD: 20</p>
<button onclick="selectPet('Blaze Fox')">Choose</button>
</div>

<div class="pet-card">
<h2>💧 Aqua Wolf</h2>
<p>Element: Water</p>
<p>HP: 140 | ATK: 25 | DEF: 20 | SPD: 18</p>
<button onclick="selectPet('Aqua Wolf')">Choose</button>
</div>

<div class="pet-card">
<h2>🌿 Leaf Bunny</h2>
<p>Element: Nature</p>
<p>HP: 130 | ATK: 22 | DEF: 22 | SPD: 22</p>
<button onclick="selectPet('Leaf Bunny')">Choose</button>
</div>

</div>

<script>
function selectPet(name){
    localStorage.setItem("starterPet", name);
    alert("You selected " + name + "!");
    location.href="gameplay.html";
}
</script>

</body>
</html>

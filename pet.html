<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Pet Adventure - Green Forest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-ui">

    <h2>🌳 Green Forest</h2>

    <div class="status">
        <p>❤️ HP: <span id="hp">100</span>/100</p>
        <p>💙 Mana: <span id="mana">100</span>/100</p>
        <p>⭐ Level: <span id="level">1</span></p>
        <p>🪙 Gold: <span id="gold">0</span></p>
    </div>

    <div class="pet">
        🐶
        <p>Your Pet</p>
    </div>

    <div class="enemy">
        👾
        <p>Green Slime</p>
        <p>❤️ HP: <span id="enemyHp">50</span>/50</p>
    </div>

    <div class="skills">
        <button id="attackBtn">⚔ Auto Attack</button>
        <button id="skillBtn">✨ Skill</button>
        <button id="superBtn">🔥 Super Skill</button>
    </div>

    <div class="quest">
        <h3>📜 Main Quest</h3>
        <p>Defeat 5 Green Slimes (0/5)</p>
    </div>

</div>

<script src="game.js"></script>

</body>
</html>
